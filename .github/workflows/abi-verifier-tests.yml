name: SM-A235F OEM ABI Verifier Regression
on:
  pull_request:
    paths:
      - scripts/compare_oem_crc.py
      - scripts/explain_stock_abi_delta.py
      - tests/test_compare_oem_crc.py
      - tests/test_explain_stock_abi_delta.py
      - references/a235fxxseezb1_stock_module_crc.tsv
      - .github/workflows/abi-verifier-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/compare_oem_crc.py
      - scripts/explain_stock_abi_delta.py
      - tests/test_compare_oem_crc.py
      - tests/test_explain_stock_abi_delta.py
      - references/a235fxxseezb1_stock_module_crc.tsv
      - .github/workflows/abi-verifier-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware CRC gate and delta regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
