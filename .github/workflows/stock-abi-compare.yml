name: SM-A235F Compare Build CRC Against Original Drivers
on:
  workflow_run:
    workflows: ["SM-A235F Stock ABI Reproduction (experimental)"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  abi_gate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [stock_baseline, stock_ksu_directhooks]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Get stock module CRC reference
        run: |
          gh run download 45077059624 --repo "$GITHUB_REPOSITORY" -n SM-A235F-OEM-CRC-reference -D stock-reference
          test -s stock-reference/stock_module_crc.tsv
      - name: Get completed stock-profile artifact
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "SM-A235F-stock-abi-${{ matrix.profile }}" -D kernel-output
          test -s kernel-output/result/Module.symvers
      - name: Compare OEM CRC without bypassing checks
        run: |
          mkdir -p reports
          python3 scripts/compare_oem_crc.py stock-reference/stock_module_crc.tsv kernel-output/result/Module.symvers "reports/${{ matrix.profile }}-ABI.txt"
      - name: Preserve comparison report, including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SM-A235F-${{ matrix.profile }}-CRC-report
          retention-days: 7
          if-no-files-found: warn
          path: reports/

  abi_delta:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original Samsung CRC metadata
        run: |
          gh run download 45077059624 --repo "$GITHUB_REPOSITORY" -n SM-A235F-OEM-CRC-reference -D stock-reference
          test -s stock-reference/stock_module_crc.tsv
      - name: Retrieve both complete build ABI tables
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n SM-A235F-stock-abi-stock_baseline -D baseline
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n SM-A235F-stock-abi-stock_ksu_directhooks -D ksu
          test -s baseline/result/Module.symvers
          test -s ksu/result/Module.symvers
      - name: Classify which symbols changed due to KernelSU
        run: |
          mkdir -p reports
          python3 scripts/explain_stock_abi_delta.py stock-reference/stock_module_crc.tsv baseline/result/Module.symvers ksu/result/Module.symvers reports/stock_vs_ksu_abi_delta.txt
      - name: Preserve full comparison even if the ABI test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SM-A235F-stock-vs-ksu-ABI-delta
          retention-days: 7
          if-no-files-found: warn
          path: reports/
